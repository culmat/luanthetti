version: 2

project_name: luanthetti

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/luanthetti
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.buildVersion={{.Version}} -X main.buildCommit={{.ShortCommit}} -X main.buildDate={{.Date}}

archives:
  # luanthetti_0.1.0_darwin_arm64.tar.gz, luanthetti_0.1.0_windows_amd64.zip; README's Install
  # section uses these names.
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS

changelog:
  use: github-native

release:
  draft: false
  prerelease: auto

# brews (culmat/homebrew-tap), scoops (culmat/scoop-bucket) and nfpms are added
# together with the first approved release; they need the tap/bucket repos and tokens.
